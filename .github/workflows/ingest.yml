name: ingest
on:
  schedule:
    - cron: '0 10 * * *'   # 06:00 America/New_York during EDT
  workflow_dispatch:

# "Refresh now" can be pressed repeatedly; never run two scans at once
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write   # for the keepalive step below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsx scripts/ingest/run.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT: ${{ secrets.VAPID_CONTACT }}
          INGEST_ADDRESS: ${{ secrets.INGEST_ADDRESS }}
          INGEST_POSTAL_CODE: ${{ secrets.INGEST_POSTAL_CODE }}
          INGEST_LAT: ${{ secrets.INGEST_LAT }}
          INGEST_LNG: ${{ secrets.INGEST_LNG }}
          INGEST_WF_STORE_ID: ${{ secrets.INGEST_WF_STORE_ID }}
      # GitHub disables scheduled workflows after 60 days without repo activity, which
      # would silently freeze the deals. Re-enabling via the API keeps the schedule alive.
      - name: Keep the daily schedule enabled
        if: always() && github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ingest.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}
